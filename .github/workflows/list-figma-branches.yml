name: List Figma branches (one-off helper)

on:
  workflow_dispatch:
    inputs:
      file_key:
        description: "Figma file key of the PARENT file (not the branch)"
        required: true
        default: "3sw45aVcngFAmpbP6cfrXP"

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Branches + variables probe
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FILE_KEY: ${{ github.event.inputs.file_key }}
        run: node scripts/figma-probe.mjs
