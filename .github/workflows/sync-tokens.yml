name: Sync tokens from Figma (PR-gated)

# Pulls the Spired variable library straight from Figma via the REST API
# (org Plan Access Token), rebuilds the token artifacts, and — if anything
# changed — opens a Pull Request with the diff. A maintainer reviews & merges:
# that merge is the approval gate. No manual export, no watcher.

on:
  schedule:
    - cron: "0 8 * * 1-5" # weekday mornings, 08:00 UTC
  workflow_dispatch: {}   # "Run workflow" button for on-demand sync

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Pull variables from Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node scripts/sync-tokens.js

      - name: Rebuild token artifacts
        run: npm run build-all

      - name: Open PR if tokens changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(tokens): sync from Figma"
          branch: bot/token-sync
          title: "Token sync from Figma"
          body: |
            Automated pull of the Spired variable library from Figma.
            Review the token diff below and merge to release.
          add-paths: |
            tokens/**
            dist/**
            nuget/**
